name: Build and push image to ECR

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  AWS_REGION: il-central-1
  ECR_REPOSITORY: hit-grading-ai
  DOKPLOY_API_PARAMETER_NAME: /hit-grading-ai/production/dokploy-api-key

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: production-dokploy
      cancel-in-progress: false
    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy immutable image through Dokploy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          test -n "$EC2_INSTANCE_ID" || { echo "Missing repository variable EC2_INSTANCE_ID" >&2; exit 1; }
          test -n "$DOKPLOY_APPLICATION_ID" || { echo "Missing repository variable DOKPLOY_APPLICATION_ID" >&2; exit 1; }

          account_id=$(aws sts get-caller-identity --query Account --output text)
          image="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          script_b64=$(base64 -w0 .github/scripts/deploy-dokploy.sh)
          commands_json=$(jq -nc \
            --arg script "$script_b64" \
            --arg image "$image" \
            --arg application_id "$DOKPLOY_APPLICATION_ID" \
            --arg parameter_name "$DOKPLOY_API_PARAMETER_NAME" \
            --arg region "$AWS_REGION" \
            '[
              ("printf %s " + $script + " | base64 -d > /tmp/deploy-dokploy.sh"),
              "chmod 700 /tmp/deploy-dokploy.sh",
              ("IMAGE=" + $image + " APPLICATION_ID=" + $application_id + " DOKPLOY_API_PARAMETER_NAME=" + $parameter_name + " AWS_REGION=" + $region + " /tmp/deploy-dokploy.sh")
            ]')

          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_TAG through Dokploy" \
            --timeout-seconds 900 \
            --max-concurrency 1 \
            --max-errors 0 \
            --parameters "commands=$commands_json" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID"

          invocation=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID")

          printf '%s\n' "$invocation" | jq -r '.StandardOutputContent, .StandardErrorContent'
          test "$(jq -r '.Status' <<<"$invocation")" = Success
